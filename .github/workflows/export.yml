name: export-redroid
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Pull image
        run: |
          for t in 13.0.0-latest 13.0.0_64only-latest 13.0.0 12.0.0-latest 11.0.0-latest; do
            echo "Trying redroid/redroid:$t"
            if docker pull redroid/redroid:$t; then echo "$t" > tag.txt; break; fi
          done
          test -s tag.txt
      - name: Export and compress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          TAG=$(cat tag.txt)
          echo "Exporting $TAG"
          docker save redroid/redroid:$TAG | zstd -T0 -3 -o redroid.tar.zst
          ls -lh redroid.tar.zst
          split -b 1800M redroid.tar.zst redroid.tar.zst.part-
          ls -lh redroid.tar.zst.part-*
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redroid-13
          name: redroid base image
          files: redroid.tar.zst.part-*
